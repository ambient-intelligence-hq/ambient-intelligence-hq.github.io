name: Deploy site to GitHub Pages

# Builds the Astro site in `site/` (landing + blog + docs) and publishes the
# generated `site/dist/` to GitHub Pages, together with the one-line installer
# (`install/install.sh` -> <site>/install.sh) and the read-only Replay Gallery
# (`replay/` -> <site>/replay/). Served at the apex domain (goambient.ai).

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "replay/**"
      - "install/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      # SITE_URL / BASE_PATH are repo variables (both optional). Defaults: apex
      # root. For an interim project page, set BASE_PATH="/<repo>".
      - run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          BASE_PATH: ${{ vars.BASE_PATH }}
      # Attach a custom domain only once it's registered + DNS points here: set
      # the repo variable SITE_DOMAIN (e.g. goambient.ai). Until then the site
      # serves on the default github.io URL.
      - name: Write CNAME (custom domain)
        if: vars.SITE_DOMAIN != ''
        run: echo "${{ vars.SITE_DOMAIN }}" > dist/CNAME

      # Read-only Replay Gallery — a static Vite app published at <site>/replay/.
      # VITE_MEDIA_BASE is the R2 bucket's public base (r2.dev URL or custom
      # domain); set it as the repo variable REPLAY_MEDIA_BASE. If unset, the app
      # falls back to the 7-day presigned URLs baked into the fixtures (fine for a
      # preview, but make the bucket public for a durable deploy).
      - name: Build replay gallery
        working-directory: replay
        env:
          VITE_MEDIA_BASE: ${{ vars.REPLAY_MEDIA_BASE }}
        run: |
          npm ci
          npm run build
      - name: Fold replay gallery into the site
        run: |
          mkdir -p dist/replay
          cp -r ../replay/dist/. dist/replay/

      # Served as-is next to the site; the repo copy is the single source.
      - run: install -m 644 ../install/install.sh dist/install.sh
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
